<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>PANDAs KITT 1.8</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7d4c5;font:16px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:20px 12px}h1{color:#f33;letter-spacing:.22em;text-shadow:0 0 15px red}small{color:#f99}.panel{background:linear-gradient(#191919,#090909);border:2px solid #793029;border-radius:18px;padding:18px 10px;margin:18px 0;box-shadow:0 0 22px #400}.leds{display:flex;justify-content:center;align-items:center;gap:7px;height:180px;background:linear-gradient(90deg,transparent 30%,#120b0b 46%,#120b0b 54%,transparent 70%)}.column{display:flex;flex-direction:column-reverse;gap:3px}.led{height:8px;width:7px;border-radius:1px;background:#260606;border:1px solid #3d0c09;transition:background .045s,box-shadow .045s}.led.on{background:#ff281a;box-shadow:0 0 6px #ff2519,0 0 12px #c00}button{background:linear-gradient(#61241d,#260c09);color:#fff;border:1px solid #ee5544;border-radius:9px;padding:14px 9px;font-weight:700;letter-spacing:.03em;touch-action:manipulation}button:active{background:#e33}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.modes button{font-size:11px}button.active{background:#ba241c;box-shadow:0 0 12px #c22}#status{min-height:40px;color:#ff9d76;margin:14px 0}.foot{font-size:12px;color:#aa7770}</style></head><body><main><h1>K.I.T.T.</h1><small>PANDAs KITT · Version 1.8 · Online-Test</small><section class="panel"><div class="leds" id="leds" aria-label="Animierter Sprachmodulator"></div><div id="status" aria-live="polite">System bereit</div></section><div class="grid"><button id="speech">▶ TESTSPRACHE</button><button id="test">◉ LED-TEST</button><button id="check">SYSTEM CHECK</button><button id="stop">STOPP</button></div><h3>FAHRMODUS</h3><div class="modes"><button data-mode="AUTO CRUISE">AUTO CRUISE</button><button data-mode="NORMAL CRUISE" class="active">NORMAL CRUISE</button><button data-mode="PURSUIT">PURSUIT</button></div><h3>FUNKTIONSTASTEN</h3><div class="grid"><button data-fn="P1">P1 · UHR</button><button data-fn="P2">P2 · GPS</button><button data-fn="P3">P3 · POSITION</button><button data-fn="P4">P4 · SPRACHE</button></div><p class="foot">Sprachausgabe benötigt eine aktive Browser-Sitzung. GPS erfordert Standortfreigabe.</p></main><script>const root=document.getElementById('leds'),status=document.getElementById('status');let speaking=false,boostUntil=0;const cols=Array.from({length:3},()=>{let c=document.createElement('div');c.className='column';root.append(c);return Array.from({length:12},()=>{let l=document.createElement('div');l.className='led';c.append(l);return l})});function pulse(){let active=speaking||Date.now()<boostUntil;cols.forEach((col,i)=>{let maxRadius=i===1?5.5:3.5;let radius=active?1+Math.random()*maxRadius:Math.random()*1.2;col.forEach((l,j)=>{let d=Math.abs(j-5.5);let on=d<=radius;l.classList.toggle('on',on);if(on){let fade=Math.max(.28,1-d/7);l.style.opacity=fade.toFixed(2);l.style.filter='saturate('+Math.max(.35,1-d/9).toFixed(2)+')'}else{l.style.opacity='.55';l.style.filter='none'}})});}setInterval(pulse,75);pulse();function say(s){status.textContent=s;if(!('speechSynthesis'in window)){status.textContent='Sprachausgabe in diesem Browser nicht verfügbar';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='de-AT';u.rate=.9;u.pitch=.8;u.onstart=()=>{speaking=true;status.textContent='KITT spricht …'};u.onend=u.onerror=()=>{speaking=false;status.textContent='System bereit'};boostUntil=Date.now()+4000;speechSynthesis.speak(u)}document.getElementById('speech').onclick=()=>say('Guten Tag. Ich bin KITT. Alle Systeme sind einsatzbereit. Wie kann ich dir helfen?');document.getElementById('test').onclick=()=>{boostUntil=Date.now()+6000;status.textContent='LED-Test läuft: sechs Sekunden'};document.getElementById('check').onclick=()=>say('Systemcheck abgeschlossen. Sprachmodulator und Bedienfeld betriebsbereit.');document.getElementById('stop').onclick=()=>{speechSynthesis?.cancel();speaking=false;boostUntil=0;status.textContent='Angehalten'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');status.textContent='Modus: '+b.dataset.mode;boostUntil=Date.now()+1200});document.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>{let n=b.dataset.fn;if(n==='P1')status.textContent='Uhrzeit: '+new Date().toLocaleTimeString('de-AT');if(n==='P4')document.getElementById('speech').click();if(n==='P2'||n==='P3'){if(!navigator.geolocation){status.textContent='GPS nicht verfügbar';return}status.textContent='GPS wird abgefragt …';navigator.geolocation.getCurrentPosition(p=>status.textContent=n==='P2'?'GPS bereit · Genauigkeit ±'+Math.round(p.coords.accuracy)+' m':'Position: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),e=>status.textContent='GPS: '+e.message,{enableHighAccuracy:true,timeout:12000})}});</script></body></html>
