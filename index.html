<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>PANDAs KITT 2.5</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7d4c5;font:16px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:20px 12px}h1{color:#f33;letter-spacing:.22em;text-shadow:0 0 15px red}small{color:#f99}.panel{background:linear-gradient(#191919,#090909);border:2px solid #793029;border-radius:18px;padding:18px 10px;margin:18px 0;box-shadow:0 0 22px #400}.leds{display:flex;flex-direction:row;justify-content:center;align-items:stretch;gap:4px;height:auto;padding:8px;background:#1a1010;border:2px solid #513435;border-radius:5px;margin:auto;width:max-content;max-width:100%;box-shadow:0 0 18px #520b0b}.column{display:flex;flex-direction:column-reverse;flex-wrap:nowrap;gap:3px;padding:4px;background:#2a1a1b;border:1px solid #483032;border-radius:2px}.led{height:11px;width:clamp(38px,15vw,58px);border-radius:1px;background:#453031;border:1px solid #563839;transition:background .06s,box-shadow .06s}.led.on{border-color:#f65c32;box-shadow:0 0 8px #d22,0 0 14px #a21}button{background:linear-gradient(#61241d,#260c09);color:#fff;border:1px solid #ee5544;border-radius:9px;padding:14px 9px;font-weight:700;letter-spacing:.03em;touch-action:manipulation}button:active{background:#e33}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.modes button{font-size:11px}button.active{background:#ba241c;box-shadow:0 0 12px #c22}#status{min-height:40px;color:#ff9d76;margin:14px 0}.foot{font-size:12px;color:#aa7770}</style></head><body><main><h1>K.I.T.T.</h1><small>PANDAs KITT · Version 2.5 · Online-Test</small><section class="panel"><div class="leds" id="leds" aria-label="Animierter Sprachmodulator"></div><div id="status" aria-live="polite">System bereit</div></section><section class="panel" style="text-align:left"><h3>STIMME EINSTELLEN</h3><label for="voice">Stimme</label><select id="voice" style="width:100%;padding:12px;background:#221010;color:white;border:1px solid #a44"></select><p><label for="rate">Tempo: <output id="rateValue">0.90</output></label><input id="rate" type="range" min="0.6" max="1.3" step="0.05" value="0.9" style="width:100%"></p><p><label for="pitch">Tonhöhe: <output id="pitchValue">0.80</output></label><input id="pitch" type="range" min="0.5" max="1.4" step="0.05" value="0.8" style="width:100%"></p><label for="testText">Testtext</label><textarea id="testText" rows="3" style="width:100%;padding:10px;background:#221010;color:white;border:1px solid #a44">Guten Tag. Ich bin KITT. Alle Systeme sind einsatzbereit. Wie kann ich dir helfen?</textarea><p class="foot">Stimmenauswahl hängt von iOS und Safari ab. Einstellungen bleiben auf diesem Gerät gespeichert.</p></section><div class="grid"><button id="speech">▶ TESTSPRACHE</button><button id="test">◉ LED-TEST</button><button id="check">SYSTEM CHECK</button><button id="stop">STOPP</button></div><h3>FAHRMODUS</h3><div class="modes"><button data-mode="AUTO CRUISE">AUTO CRUISE</button><button data-mode="NORMAL CRUISE" class="active">NORMAL CRUISE</button><button data-mode="PURSUIT">PURSUIT</button></div><h3>FUNKTIONSTASTEN</h3><div class="grid"><button data-fn="P1">P1 · UHR</button><button data-fn="P2">P2 · GPS</button><button data-fn="P3">P3 · POSITION</button><button data-fn="P4">P4 · SPRACHE</button></div><p class="foot">Sprachausgabe benötigt eine aktive Browser-Sitzung. GPS erfordert Standortfreigabe.</p></main><script>const root=document.getElementById('leds'),status=document.getElementById('status');let speaking=false,boostUntil=0;const cols=Array.from({length:3},()=>{let c=document.createElement('div');c.className='column';root.append(c);return Array.from({length:20},()=>{let l=document.createElement('div');l.className='led';c.append(l);return l})});let phase=0, speechEnergy=0, lastBoundary=0;function pulse(){const active=speaking||Date.now()<boostUntil;phase+=active?.33:.11;const wave=(1-Math.cos(phase))/2;const target=speaking?(Date.now()-lastBoundary<260?9:3+wave*3):(Date.now()<boostUntil?3+wave*7:4+wave*3);speechEnergy+=(target-speechEnergy)*(target>speechEnergy?.45:.24);const centerRadius=speaking?speechEnergy:target;const sideRadius=centerRadius*.72;cols.forEach((col,i)=>{const radius=i===1?centerRadius:sideRadius;col.forEach((led,j)=>{const distance=Math.abs(j-9.5);const on=distance<=radius;led.classList.toggle('on',on);if(on){const t=distance/10;const color=t<.25?'#ed2538':t<.48?'#ff7134':t<.68?'#ffd342':t<.84?'#fff3aa':'#fffdf1';led.style.background='linear-gradient(180deg, '+color+' 0%, '+color+' 24%, '+(t<.30?'#ff6b59':t<.48?'#ffbd73':t<.65?'#fff1aa':t<.82?'#fffdf0':'#ffffff')+' 55%, '+color+' 100%)';led.style.boxShadow='0 0 '+(10-5*t)+'px '+color+',0 0 '+(19-8*t)+'px rgba(255,55,22,.55)';led.style.opacity=String(Math.max(.68,1-t*.2))}else{led.style.background='#453031';led.style.boxShadow='none';led.style.opacity='.7'}led.style.filter='none'})})}setInterval(pulse,75);pulse();const voiceSelect=document.getElementById('voice'),rate=document.getElementById('rate'),pitch=document.getElementById('pitch'),testText=document.getElementById('testText');const saved=JSON.parse(localStorage.getItem('kittVoiceSettings')||'{}');rate.value=saved.rate||'.9';pitch.value=saved.pitch||'.8';testText.value=saved.text||testText.value;function updateLabels(){document.getElementById('rateValue').textContent=Number(rate.value).toFixed(2);document.getElementById('pitchValue').textContent=Number(pitch.value).toFixed(2)}function persist(){localStorage.setItem('kittVoiceSettings',JSON.stringify({voice:voiceSelect.value,rate:rate.value,pitch:pitch.value,text:testText.value}))}function populateVoices(){const all=speechSynthesis.getVoices();const filtered=all.filter(v=>v.lang.toLowerCase().startsWith('de'));voiceSelect.innerHTML='';filtered.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';voiceSelect.append(o)});if(saved.voice&&filtered.some(v=>v.voiceURI===saved.voice))voiceSelect.value=saved.voice;if(!filtered.length){const o=document.createElement('option');o.textContent='Systemstimme (Deutsch)';o.value='';voiceSelect.append(o)}}if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices}updateLabels();[rate,pitch].forEach(el=>el.addEventListener('input',()=>{updateLabels();persist()}));voiceSelect.addEventListener('change',persist);testText.addEventListener('input',persist);function say(s){status.textContent=s;if(!('speechSynthesis'in window)){status.textContent='Sprachausgabe in diesem Browser nicht verfügbar';return}speechSynthesis.cancel();speaking=false;let u=new SpeechSynthesisUtterance(s);u.lang='de-AT';u.rate=Number(rate.value);u.pitch=Number(pitch.value);const v=speechSynthesis.getVoices().find(x=>x.voiceURI===voiceSelect.value);if(v)u.voice=v;u.onstart=()=>{speaking=true;lastBoundary=Date.now();status.textContent='KITT spricht …'};u.onboundary=()=>{lastBoundary=Date.now()};u.onend=()=>{speaking=false;status.textContent='System bereit'};u.onerror=e=>{speaking=false;status.textContent='Sprachausgabe: '+e.error};boostUntil=0;speechSynthesis.speak(u)}document.getElementById('speech').onclick=()=>say(testText.value);document.getElementById('test').onclick=()=>{boostUntil=Date.now()+6000;status.textContent='LED-Test läuft: sechs Sekunden'};document.getElementById('check').onclick=()=>say('Systemcheck abgeschlossen. Sprachmodulator und Bedienfeld betriebsbereit.');document.getElementById('stop').onclick=()=>{speechSynthesis?.cancel();speaking=false;boostUntil=0;status.textContent='Angehalten'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');status.textContent='Modus: '+b.dataset.mode;boostUntil=Date.now()+1200});document.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>{let n=b.dataset.fn;if(n==='P1')status.textContent='Uhrzeit: '+new Date().toLocaleTimeString('de-AT');if(n==='P4')document.getElementById('speech').click();if(n==='P2'||n==='P3'){if(!navigator.geolocation){status.textContent='GPS nicht verfügbar';return}status.textContent='GPS wird abgefragt …';navigator.geolocation.getCurrentPosition(p=>status.textContent=n==='P2'?'GPS bereit · Genauigkeit ±'+Math.round(p.coords.accuracy)+' m':'Position: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),e=>status.textContent='GPS: '+e.message,{enableHighAccuracy:true,timeout:12000})}});</script></body></html>
